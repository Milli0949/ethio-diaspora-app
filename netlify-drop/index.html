      function compressImageToDataUrl(file, maxDim = 640) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(new Error('Failed to read file'));
          reader.onload = (ev) => {
            const src = ev.target.result;
            if (!file.type.startsWith('image/')) { resolve(src); return; }
            const img = new Image();
            img.onerror = () => resolve(src);
            img.onload = () => {
              const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
              const w = Math.max(1, Math.round(img.width * scale));
              const h = Math.max(1, Math.round(img.height * scale));
              const canvas = document.createElement('canvas');
              canvas.width = w; canvas.height = h;
              const ctx = canvas.getContext('2d');
              if (!ctx) { resolve(src); return; }
              ctx.drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL('image/jpeg', 0.8));
            };
            img.src = src;
          };
          reader.readAsDataURL(file);
        });
      }

      function makeSamplePortraitDataUrl(label, bg, accent) {
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${bg}"/><stop offset="100%" stop-color="${accent}"/></linearGradient></defs><rect width="320" height="320" fill="url(#g)"/><circle cx="160" cy="118" r="52" fill="rgba(255,255,255,0.22)"/><path d="M72 280 C72 210, 248 210, 248 280" fill="rgba(255,255,255,0.18)"/><text x="160" y="295" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="sans-serif" font-size="18" font-weight="600">${label}</text></svg>`;
        return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;

        const [selfieVerified, setSelfieVerified] = useState(initialProfile?.selfieVerified || false);
        const [locationVerified, setLocationVerified] = useState(initialProfile?.locationVerified || false);
        const [verifiedCity, setVerifiedCity] = useState(initialProfile?.verifiedCity || '');
        const [password, setPassword] = useState(initialProfile?.password || '');
        const [activeSlot, setActiveSlot] = useState(0);
        const [cameraOpen, setCameraOpen] = useState(false);
        const [locating, setLocating] = useState(false);
        const fileInputRef = useRef(null);

        const handlePickSlot = (idx) => { setActiveSlot(idx); if (fileInputRef.current) fileInputRef.current.click(); };
        const handleFileChange = async (e) => {
          const file = e.target.files?.[0];
          e.target.value = '';
          if (!file) return;
          try {
            const compressed = await compressImageToDataUrl(file, 640);
            setPhotos((prev) => { const n = [...prev]; n[activeSlot] = compressed; return n; });
            onNotify(lang === 'am' ? `ፎቶ ${activeSlot + 1} ተጭኗል!` : `Photo ${activeSlot + 1} uploaded!`);
          } catch { onNotify(lang === 'am' ? 'ፎቶ መጫን አልተቻለም' : 'Failed to load photo'); }
        };

        const handleAutoFillSamples = () => {
          const palettes = [['#e11d48', '#881337'], ['#2563eb', '#1e3a8a'], ['#9333ea', '#581c87'], ['#059669', '#064e3b']];
          const labels = ['Profile', 'Photo 1', 'Photo 2', 'Photo 3'];
          setPhotos((prev) => prev.map((ex, i) => ex || makeSamplePortraitDataUrl(labels[i], palettes[i][0], palettes[i][1])));
          onNotify(lang === 'am' ? 'የናሙና ፎቶዎች ተሞልተዋል!' : 'Sample portraits filled!');
        };

        const handleVerifyLocation = () => {
          setLocating(true);
          const finish = (lbl) => {
            setLocating(false); setLocationVerified(true);
            if (lbl) setVerifiedCity(lbl);
            onNotify(lang === 'am' ? 'ቦታዎ ተረጋግጧል!' : 'GPS Location Verified!');
          };
          if (!navigator.geolocation) { finish(city.trim() || 'Addis Ababa'); return; }
          navigator.geolocation.getCurrentPosition(
            (pos) => finish(city.trim() ? `${city.trim()} (${pos.coords.latitude.toFixed(2)}, ${pos.coords.longitude.toFixed(2)})` : `${pos.coords.latitude.toFixed(2)}, ${pos.coords.longitude.toFixed(2)}`),
            () => finish(city.trim() || 'Addis Ababa'),
            { timeout: 4000 }
          );
        };

        const handleSubmit = (e) => {
          e.preventDefault();
          const parsedAge = parseInt(age, 10);

            onNotify(lang === 'am' ? 'ስም፣ ዕድሜ (18+)፣ ጾታ እና ከተማ መሙላት ግዴታ ነው!' : 'Please fill name, age (18+), gender, and city!');

                      <option value="">{lang === 'am' ? 'ሃይማኖት ይምረጡ' : 'Select Religion'}</option>
                      <option value="ኦርቶዶክስ / Orthodox">ኦርቶዶክስ / Orthodox</option>
                      <option value="እስልምና / Muslim">እስልምና / Muslim</option>
                      <option value="ፕሮቴስታንት / Protestant">ፕሮቴስታንት / Protestant</option>
                      <option value="ሌላ / Other">ሌላ / Other</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-zinc-600 dark:text-zinc-400 mb-1">{lang === 'am' ? 'የትውውቅ ዓላማ' : 'Relationship Goal'}</label>
                    <select value={goal} onChange={(e) => setGoal(e.target.value)} className="w-full min-h-[44px] rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 px-3 text-sm text-zinc-900 dark:text-zinc-100 focus:outline-none focus:border-rose-500">
                      <option value="">{lang === 'am' ? 'ዓላማ ይምረጡ' : 'Select Goal'}</option>
                      <option value="ለትዳር / Marriage">ለትዳር / Marriage</option>
                      <option value="ለፍቅር ግንኙነት / Serious Relationship">ለፍቅር ግንኙነት / Serious Relationship</option>
                      <option value="ለጓደኝነት / Friendship">ለጓደኝነት / Friendship</option>
                    </select>
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-medium text-zinc-600 dark:text-zinc-400 mb-1">{lang === 'am' ? 'ፍላጎቶች (Hobbies)' : 'Hobbies'}</label>
                  <input value={hobbies} onChange={(e) => setHobbies(e.target.value)} placeholder={lang === 'am' ? 'ሙዚቃ, ጉዞ, ቡና' : 'Music, Travel, Coffee'} className="w-full min-h-[44px] rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 px-3.5 text-sm text-zinc-900 dark:text-zinc-100 focus:outline-none focus:border-rose-500" />
                </div>
                <div>
                  <label className="block text-xs font-medium text-zinc-600 dark:text-zinc-400 mb-1">{lang === 'am' ? 'ስለራስዎ አጭር መግለጫ' : 'Short Bio'}</label>
                  <textarea rows={3} value={bio} onChange={(e) => setBio(e.target.value)} placeholder={lang === 'am' ? 'ስለራስዎ ጥቂት ይጻፉ...' : 'Write a short intro...'} className="w-full rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 px-3.5 py-2.5 text-sm text-zinc-900 dark:text-zinc-100 focus:outline-none focus:border-rose-500" />
                </div>
                <div>
                  <label className="block text-xs font-medium text-zinc-600 dark:text-zinc-400 mb-1">{lang === 'am' ? 'የይለፍ ቃል (Password - አማራጭ)' : 'Account Password (Optional)'}</label>
                  <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder={lang === 'am' ? 'ቢያንስ 4 ቁምፊ' : 'Min 4 characters'} className="w-full min-h-[44px] rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 px-3.5 text-sm text-zinc-900 dark:text-zinc-100 focus:outline-none focus:border-rose-500" />
                </div>
              </div>

              <div className="rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 p-5">
                <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                  <div>
                    <h3 className="text-sm font-semibold text-zinc-900 dark:text-white">{lang === 'am' ? '1 የፕሮፋይል ፎቶ + 3 ተጨማሪ ፎቶዎች (4ቱም ግዴታ ናቸው)' : '1 Profile Photo + 3 Extra Photos (All 4 Required)'}</h3>
                    <p className="text-xs text-zinc-500 dark:text-zinc-400 tabular-nums">{photos.filter(Boolean).length} / 4 {lang === 'am' ? 'ተጭኗል' : 'uploaded'}</p>
                  </div>
                  <button type="button" onClick={handleAutoFillSamples} className="min-h-[38px] px-3 rounded-lg border border-zinc-200 dark:border-zinc-700 text-xs font-medium text-zinc-700 dark:text-zinc-300 flex items-center gap-1.5 cursor-pointer">
                    <Icon name="sparkles" className="w-3.5 h-3.5 text-rose-500" />
                    <span>{lang === 'am' ? 'ናሙና ፎቶ ሙላ' : 'Fill Sample Portraits'}</span>
                  </button>
                </div>
                <input ref={fileInputRef} type="file" accept="image/*" className="hidden" onChange={handleFileChange} />
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  {photos.map((src, idx) => (
                    <div key={idx} onClick={() => handlePickSlot(idx)} className="relative aspect-square rounded-2xl border border-dashed border-zinc-300 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-950 overflow-hidden flex flex-col items-center justify-center cursor-pointer hover:border-rose-500 group">
                      {src ? (
                        <>
                          <img src={src} alt={slotLabels[idx]} className="w-full h-full object-cover" />
                          <button type="button" onClick={(e) => { e.stopPropagation(); setPhotos((p) => { const n = [...p]; n[idx] = null; return n; }); }} className="absolute top-2 right-2 w-8 h-8 rounded-full bg-black/70 text-white flex items-center justify-center hover:bg-red-600 cursor-pointer">
                            <Icon name="trash" className="w-3.5 h-3.5" />
                          </button>
                        </>
                      ) : (
                        <div className="text-center px-2">
                          <Icon name="plus" className="w-5 h-5 text-zinc-400 mx-auto mb-1" />
                          <span className="text-xs font-medium text-zinc-500 dark:text-zinc-400">{slotLabels[idx]}</span>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <button type="button" onClick={() => setCameraOpen(true)} className={`min-h-[56px] rounded-2xl border px-4 py-3 flex items-center justify-center gap-2.5 text-sm font-semibold cursor-pointer ${selfieVerified ? 'border-emerald-500/50 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400' : 'border-dashed border-rose-500/60 bg-rose-500/5 text-rose-600 dark:text-rose-400'}`}>
                  <Icon name={selfieVerified ? 'checkcircle' : 'camera'} className="w-4 h-4 shrink-0" />
                  <span>{selfieVerified ? (lang === 'am' ? 'የፊት ካሜራ ተረጋግጧል' : 'Selfie Verified') : (lang === 'am' ? 'የፊት ካሜራ ማረጋገጫ (Selfie)' : 'Tap for Selfie Verification')}</span>
                </button>
                <button type="button" onClick={handleVerifyLocation} disabled={locating} className={`min-h-[56px] rounded-2xl border px-4 py-3 flex items-center justify-center gap-2.5 text-sm font-semibold cursor-pointer ${locationVerified ? 'border-emerald-500/50 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400' : 'border-dashed border-rose-500/60 bg-rose-500/5 text-rose-600 dark:text-rose-400'}`}>
                  <Icon name={locationVerified ? 'shieldcheck' : 'mappin'} className="w-4 h-4 shrink-0" />
                  <span>{locating ? (lang === 'am' ? 'ቦታ በመፈለግ ላይ...' : 'Detecting...') : locationVerified ? (lang === 'am' ? 'ቦታ ተረጋግጧል' : 'Location Verified') : (lang === 'am' ? 'ያሉበትን ቦታ ያረጋግጡ (GPS)' : 'Tap to Verify GPS Location')}</span>
                </button>
              </div>

              <button type="submit" className="w-full min-h-[50px] rounded-2xl bg-rose-600 hover:bg-rose-500 text-white font-semibold text-sm flex items-center justify-center gap-2 cursor-pointer">
                <Icon name="usercheck" className="w-4 h-4" />
                <span>{isEditing ? (lang === 'am' ? 'ለውጦችን አስቀምጥ' : 'Save Profile Changes') : (lang === 'am' ? 'መገለጫ አስቀምጥ እና ቀጥል' : 'Save Profile & Continue')}</span>
              </button>
            </form>

            <SelfieModal open={cameraOpen} lang={lang} onVerify={(snap) => { setSelfieVerified(true); if (snap && !photos[0]) setPhotos((p) => { const n = [...p]; n[0] = snap; return n; }); setCameraOpen(false); onNotify(lang === 'am' ? 'የፊት ካሜራ ማረጋገጫ ተሳክቷል!' : 'Selfie verified!'); }} onClose={() => setCameraOpen(false)} />
          </div>
        );
      };
      // --- Main Feed, Detail, Matches, Search ---
      const DiscoveryAndPostsScreen = ({ lang, currentUser, people, blockedIds, posts, activeSubTab, onChangeSubTab, onViewPerson, onToggleFriend, onLikePerson, onOpenChat, onAddPost, onTogglePostLike, onAddComment, onNotify }) => {
        const [peopleFilter, setPeopleFilter] = useState('all');
        const [postText, setPostText] = useState('');
        const [postVisibility, setPostVisibility] = useState('all');
        const [postMedia, setPostMedia] = useState(null);
        const [openCommentsId, setOpenCommentsId] = useState(null);
        const [commentInputs, setCommentInputs] = useState({});
        const fileRef = useRef(null);

        const visiblePeople = people.filter((p) => !blockedIds.includes(p.id)).filter((p) => {
          if (peopleFilter === 'online') return p.online;
          if (peopleFilter === 'marriage' || peopleFilter === 'serious' || peopleFilter === 'friendship') return p.goal === peopleFilter;
          return true;
        });

        const visiblePosts = posts.filter((post) => {
          if (post.authorId && blockedIds.includes(post.authorId)) return false;
          if (post.visibility === 'friends' && post.authorId) {
            const author = people.find((p) => p.id === post.authorId);
            if (author && !author.isFriend) return false;
          }
          return true;
        });

        const handleMediaPick = async (e) => {
          const file = e.target.files?.[0];
          e.target.value = '';
          if (!file) return;
          try {
            const url = file.type.startsWith('image/')
              ? await compressImageToDataUrl(file, 800)
              : await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('err')); r.readAsDataURL(file); });
            setPostMedia({ name: file.name, url, type: file.type });
          } catch { onNotify(lang === 'am' ? 'ፋይሉን መጫን አልተቻለም' : 'Could not attach file'); }
        };

        const handlePublishPost = (e) => {
          e.preventDefault();
          const cleaned = postText.trim();
          if (!cleaned && !postMedia) return;
          if (containsBadWords(cleaned)) {
            setPostText('');
            onNotify(lang === 'am' ? 'በዋናው ገጽ ላይ ተገቢ ያልሆኑ ቃላት አይፈቀዱም!' : 'Profanity is blocked on the main feed!');
            return;
          }
          onAddPost(cleaned, postVisibility, postMedia);
          setPostText('');
          setPostMedia(null);
        };

        const handleDownloadPost = (post) => {
          const link = document.createElement('a');
          if (post.media) { link.href = post.media.url; link.download = post.media.name; }
          else { const blob = new Blob([`${post.author}\n\n${post.text}`], { type: 'text/plain;charset=utf-8' }); link.href = URL.createObjectURL(blob); link.download = `FikirBeNetsa_Post_${post.id}.txt`; }
          link.click();
          onNotify(lang === 'am' ? 'ወርዷል!' : 'Downloaded!');
        };

        const handleCommentSubmit = (postId, e) => {
          e.preventDefault();
          const text = (commentInputs[postId] || '').trim();
          if (!text) return;
          if (containsBadWords(text)) { onNotify(lang === 'am' ? 'በዋናው ገጽ ላይ ተገቢ ያልሆኑ ቃላት አይፈቀዱም!' : 'Profanity is blocked on the main feed!'); return; }
          onAddComment(postId, text);
          setCommentInputs((prev) => ({ ...prev, [postId]: '' }));
        };

        const filterButtons = [
          { id: 'all', am: 'ሁሉም', en: 'All' },
          { id: 'online', am: 'መስመር ላይ', en: 'Online' },
          { id: 'marriage', am: 'ለትዳር', en: 'Marriage' },
          { id: 'serious', am: 'ለፍቅር', en: 'Serious' },
          { id: 'friendship', am: 'ለጓደኝነት', en: 'Friendship' }
        ];

        return (
          <div className="space-y-4">
            <div className="grid grid-cols-2 gap-1.5 p-1 rounded-2xl bg-zinc-200/80 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800">
              <button type="button" onClick={() => onChangeSubTab('people')} className={`min-h-[44px] rounded-xl text-sm font-semibold flex items-center justify-center gap-2 cursor-pointer ${activeSubTab === 'people' ? 'bg-rose-600 text-white shadow-sm' : 'text-zinc-600 dark:text-zinc-400'}`}>
                <Icon name="users" className="w-4 h-4" />
                <span>{lang === 'am' ? 'ሰዎች' : 'People'}</span>
              </button>
              <button type="button" onClick={() => onChangeSubTab('posts')} className={`min-h-[44px] rounded-xl text-sm font-semibold flex items-center justify-center gap-2 cursor-pointer ${activeSubTab === 'posts' ? 'bg-rose-600 text-white shadow-sm' : 'text-zinc-600 dark:text-zinc-400'}`}>
                <Icon name="message" className="w-4 h-4" />
                <span>{lang === 'am' ? 'ፖስቶች' : 'Posts'}</span>
              </button>
            </div>

            {activeSubTab === 'people' ? (
              <div className="space-y-4">
                <div className="flex items-center gap-1.5 overflow-x-auto pb-1">
                  {filterButtons.map((btn) => (
                    <button key={btn.id} type="button" onClick={() => setPeopleFilter(btn.id)} className={`min-h-[38px] px-3.5 rounded-xl text-xs font-medium whitespace-nowrap shrink-0 cursor-pointer ${peopleFilter === btn.id ? 'bg-zinc-900 text-white dark:bg-white dark:text-zinc-900' : 'bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 text-zinc-600 dark:text-zinc-400'}`}>
                      {lang === 'am' ? btn.am : btn.en}
                    </button>
                  ))}
                </div>
                {visiblePeople.length === 0 ? (
                  <div className="rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 p-8 text-center">
                    <p className="text-sm text-zinc-500 dark:text-zinc-400">{lang === 'am' ? 'በዚህ ምድብ ውስጥ ሰው አልተገኘም።' : 'No profiles match this filter right now.'}</p>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                    {visiblePeople.map((person) => (
                      <div key={person.id} className="rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 p-4 flex flex-col justify-between gap-4">
                        <div onClick={() => onViewPerson(person.id)} className="cursor-pointer space-y-3">
                          <div className="flex items-start gap-3.5">
                            <Avatar name={person.name} color={person.color} size="lg" verified />
                            <div className="min-w-0 flex-1">
                              <div className="flex items-center justify-between gap-2">
                                <h3 className="text-base font-bold text-zinc-900 dark:text-white truncate tabular-nums">{person.name}, {person.age}</h3>
                                <span className="text-xs font-medium text-zinc-500 dark:text-zinc-400 shrink-0">{person.online ? (lang === 'am' ? 'መስመር ላይ' : 'Online') : (lang === 'am' ? 'ከመስመር ውጭ' : 'Offline')}</span>
                              </div>
                              <p className="text-xs text-zinc-500 dark:text-zinc-400 mt-0.5 truncate">{person.city} · {person.job}</p>
                              <p className="text-xs text-rose-600 dark:text-rose-400 font-medium mt-1">{genderLabel(person.gender, lang)} · {goalLabel(person.goal, lang)}</p>
                            </div>
                          </div>
                          <p className="text-sm text-zinc-700 dark:text-zinc-300 line-clamp-2 leading-relaxed">“{person.bio}”</p>
                        </div>
                        <div className="grid grid-cols-3 gap-2 pt-2 border-t border-zinc-100 dark:border-zinc-800/80">
                          <button type="button" onClick={() => onToggleFriend(person.id)} className={`min-h-[44px] px-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 cursor-pointer ${person.isFriend ? 'bg-emerald-500/15 text-emerald-700 dark:text-emerald-400' : 'bg-zinc-100 dark:bg-zinc-800 text-zinc-800 dark:text-zinc-200'}`}>
                            <Icon name={person.isFriend ? 'check' : 'userplus'} className="w-3.5 h-3.5" />
                            <span>{person.isFriend ? (lang === 'am' ? 'ጓደኛ' : 'Friends') : (lang === 'am' ? 'አክል' : 'Add')}</span>
                          </button>
                          <button type="button" onClick={() => onLikePerson(person.id)} className={`min-h-[44px] px-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 cursor-pointer ${person.likedByMe ? 'bg-rose-600 text-white' : 'bg-rose-500/10 text-rose-600 dark:text-rose-400'}`}>
                            <Icon name="heart" className="w-3.5 h-3.5" fill={person.likedByMe ? '#fff' : 'none'} />
                            <span>{person.likedByMe ? (lang === 'am' ? 'ተወዷል' : 'Liked') : (lang === 'am' ? 'ውደድ' : 'Like')}</span>
                          </button>
                          <button type="button" onClick={() => onOpenChat(person.id)} className="min-h-[44px] px-2 rounded-xl bg-zinc-100 dark:bg-zinc-800 text-zinc-800 dark:text-zinc-200 text-xs font-semibold flex items-center justify-center gap-1.5 cursor-pointer">
                            <Icon name="message" className="w-3.5 h-3.5" />
                            <span>{lang === 'am' ? 'ቻት' : 'Chat'}</span>
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ) : (
              <div className="space-y-4 max-w-2xl mx-auto w-full">
                <form onSubmit={handlePublishPost} className="rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 p-4 space-y-3">
                  <div className="flex items-start gap-3">
                    <Avatar name={currentUser.name} src={currentUser.photos.find(Boolean)} size="sm" />
                    <textarea rows={2} value={postText} onChange={(e) => setPostText(e.target.value)} placeholder={lang === 'am' ? 'ሃሳብዎን ያጋሩ...' : 'Share your thoughts with the community...'} className="flex-1 rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 px-3.5 py-2.5 text-sm text-zinc-900 dark:text-zinc-100 focus:outline-none focus:border-rose-500" />
                  </div>
                  {postMedia && (
                    <div className="flex items-center justify-between rounded-xl bg-emerald-500/10 border border-emerald-500/30 px-3 py-2 text-xs text-emerald-700 dark:text-emerald-300">
                      <span className="truncate">{postMedia.name}</span>
                      <button type="button" onClick={() => setPostMedia(null)} className="ml-2 p-1 cursor-pointer"><Icon name="x" className="w-3.5 h-3.5" /></button>
                    </div>
                  )}
                  <input ref={fileRef} type="file" accept="image/*,video/*,audio/*" className="hidden" onChange={handleMediaPick} />
                  <div className="flex items-center gap-2">
                    <button type="button" onClick={() => fileRef.current && fileRef.current.click()} className="min-h-[44px] min-w-[44px] rounded-xl bg-zinc-100 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-200 flex items-center justify-center cursor-pointer"><Icon name="paperclip" className="w-4 h-4" /></button>
                    <select value={postVisibility} onChange={(e) => setPostVisibility(e.target.value)} className="min-h-[44px] flex-1 rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 px-3 text-xs sm:text-sm text-zinc-800 dark:text-zinc-200">
                      <option value="all">{lang === 'am' ? 'ለሁሉም (Public)' : 'Public'}</option>
                      <option value="friends">{lang === 'am' ? 'ለጓደኞች ብቻ (Friends)' : 'Friends Only'}</option>
                    </select>
                    <button type="submit" className="min-h-[44px] px-5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-sm font-semibold cursor-pointer">{lang === 'am' ? 'ፖስት' : 'Post'}</button>
                  </div>
                </form>

                {visiblePosts.map((post) => {
                  const commentsOpen = openCommentsId === post.id;
                  return (
                    <article key={post.id} className="rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 p-4 space-y-3">
                      <div>
                        <h4 className="text-sm font-semibold text-zinc-900 dark:text-white">{post.author}</h4>
                        <p className="text-xs text-zinc-500 dark:text-zinc-400 tabular-nums">{post.visibility === 'all' ? (lang === 'am' ? 'ለሁሉም' : 'Public') : (lang === 'am' ? 'ለጓደኞች' : 'Friends')} · {post.createdAt}</p>
                      </div>
                      {post.text && <p className="text-sm text-zinc-800 dark:text-zinc-200 leading-relaxed whitespace-pre-wrap">{post.text}</p>}
                      {post.media && (
                        <div className="rounded-xl overflow-hidden border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-950">
                          {post.media.type.startsWith('image/') ? <img src={post.media.url} alt={post.media.name} className="w-full max-h-80 object-cover" /> : post.media.type.startsWith('video/') ? <video src={post.media.url} controls className="w-full max-h-80" /> : post.media.type.startsWith('audio/') ? <div className="p-3"><audio src={post.media.url} controls className="w-full" /></div> : <div className="p-3 text-xs text-zinc-500">{post.media.name}</div>}
                        </div>
                      )}

                    <button type="button" onClick={() => onOpenChat(person.id)} className="min-h-[42px] px-4 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold shrink-0 cursor-pointer">{lang === 'am' ? 'ቻት' : 'Chat'}</button>

            {admirers.length > 0 && (

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {admirers.map((person) => (
                    <div key={person.id} onClick={() => onViewPerson(person.id)} className="rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 p-4 flex items-center justify-between gap-3 cursor-pointer">
                      <div className="flex items-center gap-3 min-w-0">
                        <Avatar name={person.name} color={person.color} size="md" />
                        <div className="min-w-0"><p className="text-sm font-bold truncate tabular-nums">{person.name}, {person.age}</p><p className="text-xs text-zinc-500 truncate">{person.city}</p></div>

      const SearchScreen = ({ lang, people, blockedIds, onViewPerson, onOpenChat }) => {
        const [query, setQuery] = useState('');
        const [genderFilter, setGenderFilter] = useState('all');
        const results = people.filter((p) => !blockedIds.includes(p.id)).filter((p) => genderFilter === 'all' ? true : p.gender === genderFilter).filter((p) => {
          const q = query.trim().toLowerCase();
          if (!q) return true;
          return p.city.toLowerCase().includes(q) || p.name.toLowerCase().includes(q) || p.job.toLowerCase().includes(q) || p.hobbies.toLowerCase().includes(q);
        });
        return (
          <div className="max-w-3xl mx-auto w-full space-y-4">
            <div>
              <h2 className="text-xl font-bold text-zinc-900 dark:text-white">{lang === 'am' ? 'በከተማ እና በፍላጎት ይፈልጉ' : 'Search by City & Interests'}</h2>
              <p className="text-xs sm:text-sm text-zinc-500 dark:text-zinc-400 mt-1">{lang === 'am' ? 'ከተማ፣ ስም፣ ስራ ወይም ፍላጎት ይጻፉ።' : 'Filter members by city, name, profession, or hobbies.'}</p>

      };
      // --- Chat & Notifications ---
      const ChatScreen = ({ lang, currentUser, people, blockedIds, activePersonId, conversations, messagePrivacy, onSelectPerson, onSendMessage, onBlockPerson, onReportPerson, onOpenSettings, onNotify }) => {
        const [input, setInput] = useState('');
        const [replyPreview, setReplyPreview] = useState('');
        const fileRef = useRef(null);
        const scrollRef = useRef(null);

        const availablePeople = people.filter((p) => !blockedIds.includes(p.id));
        const activePerson = availablePeople.find((p) => p.id === activePersonId) || availablePeople[0] || null;
        const messages = activePerson ? conversations[activePerson.id] || [] : [];

        useEffect(() => {
          if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
        }, [messages.length, activePerson?.id]);

        const isChatLocked = messagePrivacy === 'none' || (messagePrivacy === 'friends' && activePerson ? !activePerson.isFriend : false);

        const handleSend = (e) => {
          e.preventDefault();
          if (!activePerson) return;
          if (isChatLocked) { onNotify(messagePrivacy === 'none' ? (lang === 'am' ? 'መልእክቶች ተቆልፈዋል!' : 'Messages locked!') : (lang === 'am' ? 'ለጓደኞች ብቻ የተፈቀደ ነው!' : 'Friends Only!')); return; }
          const text = input.trim();
          if (!text) return;
          onSendMessage(activePerson.id, text, replyPreview || undefined);
          setInput('');
          setReplyPreview('');
        };

        const handleFileAttach = async (e) => {
          const file = e.target.files?.[0];
          e.target.value = '';
          if (!file || !activePerson) return;
          if (isChatLocked) { onNotify(lang === 'am' ? 'መልእክቶች ተቆልፈዋል!' : 'Messages locked!'); return; }
          try {
            const url = file.type.startsWith('image/')
              ? await compressImageToDataUrl(file, 720)
              : await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('err')); r.readAsDataURL(file); });
            onSendMessage(activePerson.id, '', replyPreview || undefined, { name: file.name, url, type: file.type });
            setReplyPreview('');
            onNotify(lang === 'am' ? 'ፋይል ተልኳል!' : 'Attachment sent!');
          } catch { onNotify(lang === 'am' ? 'ፋይል መላክ አልተቻለም' : 'Could not attach file'); }
        };

        if (!activePerson) {
          return (
            <div className="max-w-2xl mx-auto w-full rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 p-8 text-center">
              <Icon name="message" className="w-8 h-8 text-zinc-400 mx-auto mb-2" />
              <p className="text-sm text-zinc-500">{lang === 'am' ? 'ለመወያየት ሰው የለም።' : 'No active conversations available.'}</p>
            </div>
          );
        }

        return (
          <div className="max-w-4xl mx-auto w-full flex flex-col gap-3 h-[calc(100vh-12.5rem)] lg:h-[calc(100vh-5rem)]">
            <div className="flex items-center gap-2 overflow-x-auto pb-1 shrink-0">
              {availablePeople.map((person) => (
                <button key={person.id} type="button" onClick={() => { onSelectPerson(person.id); setReplyPreview(''); }} className={`min-h-[44px] px-3 py-1.5 rounded-xl border flex items-center gap-2 shrink-0 cursor-pointer ${person.id === activePerson.id ? 'border-rose-500 bg-rose-500/10 text-rose-600 dark:text-rose-400' : 'border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 text-zinc-700 dark:text-zinc-300'}`}>
                  <Avatar name={person.name} color={person.color} size="xs" />
                  <span className="text-xs font-semibold whitespace-nowrap">{person.name}</span>
                </button>
              ))}
            </div>

            <div className="flex-1 min-h-0 rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 flex flex-col overflow-hidden">
              <div className="px-4 py-3 border-b border-zinc-200 dark:border-zinc-800 flex items-center justify-between gap-2 shrink-0">
                <div className="flex items-center gap-3 min-w-0">
                  <Avatar name={activePerson.name} color={activePerson.color} size="sm" verified />
                  <div className="min-w-0">
                    <h3 className="text-sm font-bold text-zinc-900 dark:text-white truncate tabular-nums">{activePerson.name}, {activePerson.age}</h3>
                    <p className="text-[11px] text-emerald-600 dark:text-emerald-400 font-medium">{activePerson.online ? (lang === 'am' ? 'መስመር ላይ (Online)' : 'Online') : (lang === 'am' ? 'በቅርቡ ታይቷል' : 'Recently active')}</p>
                  </div>
                </div>
                <div className="flex items-center gap-1.5 shrink-0">
                  <button type="button" onClick={() => onBlockPerson(activePerson.id)} className="min-h-[38px] px-3 rounded-lg bg-zinc-100 dark:bg-zinc-800 text-red-500 text-xs font-semibold flex items-center gap-1 cursor-pointer">
                    <Icon name="shieldban" className="w-3.5 h-3.5" /><span>{lang === 'am' ? 'አግድ' : 'Block'}</span>
                  </button>
                  <button type="button" onClick={() => onReportPerson(`${activePerson.name}, ${activePerson.age}`)} className="min-h-[38px] px-3 rounded-lg bg-zinc-100 dark:bg-zinc-800 text-amber-600 dark:text-amber-400 text-xs font-semibold flex items-center gap-1 cursor-pointer">
                    <Icon name="flag" className="w-3.5 h-3.5" /><span>{lang === 'am' ? 'ሪፖርት' : 'Report'}</span>
                  </button>
                </div>
              </div>

              <div ref={scrollRef} className="flex-1 overflow-y-auto p-4 space-y-3">
                {messages.length === 0 ? (
                  <div className="h-full flex items-center justify-center text-sm text-zinc-500">{lang === 'am' ? `ከ${activePerson.name} ጋር ውይይት ይጀምሩ!` : `Say hello to ${activePerson.name}!`}</div>
                ) : (
                  messages.map((msg) => {
                    const isOut = msg.from === 'out';
                    return (
                      <div key={msg.id} onClick={() => setReplyPreview(msg.text || msg.file?.name || 'File')} className={`flex items-end gap-2 max-w-[85%] sm:max-w-[75%] cursor-pointer ${isOut ? 'ml-auto flex-row-reverse' : ''}`}>
                        <Avatar name={isOut ? currentUser.name : activePerson.name} src={isOut ? currentUser.photos.find(Boolean) : undefined} color={activePerson.color} size="xs" />
                        <div className={`rounded-2xl px-3.5 py-2.5 text-sm leading-relaxed space-y-1.5 ${isOut ? 'bg-rose-600 text-white rounded-br-sm' : 'bg-zinc-100 dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 rounded-bl-sm'}`}>
                          {msg.replyTo && <div className={`text-[11px] px-2.5 py-1 rounded-lg ${isOut ? 'bg-black/20' : 'bg-zinc-200/70 dark:bg-zinc-700/60'}`}>↪ {msg.replyTo}</div>}
                          {msg.text && <p className="whitespace-pre-wrap">{msg.text}</p>}
                          {msg.file && (
                            <div className="space-y-1.5">
                              {msg.file.type.startsWith('image/') && <img src={msg.file.url} alt={msg.file.name} className="max-h-48 rounded-xl object-cover" />}
                              <div className="flex items-center justify-between gap-3 text-xs">
                                <span className="truncate font-medium">{msg.file.name}</span>
                                <a href={msg.file.url} download={msg.file.name} onClick={(e) => e.stopPropagation()} className={`px-2 py-1 rounded-lg flex items-center gap-1 shrink-0 font-semibold ${isOut ? 'bg-black/25 text-white' : 'bg-zinc-200 dark:bg-zinc-700'}`}>
                                  <Icon name="download" className="w-3 h-3" /><span>{lang === 'am' ? 'አውርድ' : 'Save'}</span>
                                </a>
                              </div>
                            </div>
                          )}
                          <div className={`flex items-center justify-end gap-1 text-[10px] tabular-nums ${isOut ? 'text-white/80' : 'text-zinc-500'}`}>
                            <span>{msg.time}</span>
                            {isOut && <Icon name="checkcheck" className="w-3.5 h-3.5 text-sky-300" />}
                          </div>
                        </div>
                      </div>
                    );

              {isChatLocked ? (
                <div className="p-3.5 border-t border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-950 flex items-center justify-between gap-3">
                  <div className="flex items-center gap-2 text-xs text-zinc-600 dark:text-zinc-400">
                    <Icon name="lock" className="w-4 h-4 text-rose-500 shrink-0" />
                    <span>{messagePrivacy === 'none' ? (lang === 'am' ? 'መልእክት መላክ በግላዊነት ቅንብር ተቆልፏል።' : 'Messaging locked in Privacy Settings.') : (lang === 'am' ? 'መልእክት መላክ የሚቻለው ለጓደኞች ብቻ ነው።' : 'Restricted to Friends Only.')}</span>
                  </div>
                  <button type="button" onClick={onOpenSettings} className="min-h-[38px] px-3 rounded-xl bg-rose-600 text-white text-xs font-semibold shrink-0 cursor-pointer">{lang === 'am' ? 'ቅንብር' : 'Settings'}</button>
                </div>
              ) : (
                <div className="p-3 border-t border-zinc-200 dark:border-zinc-800 space-y-2 shrink-0">
                  {replyPreview && (
                    <div className="flex items-center justify-between rounded-xl bg-zinc-100 dark:bg-zinc-800 px-3 py-1.5 text-xs">
                      <span className="truncate">↪ {replyPreview}</span>
                      <button type="button" onClick={() => setReplyPreview('')} className="ml-2 p-1 cursor-pointer"><Icon name="x" className="w-3.5 h-3.5" /></button>
                    </div>
                  )}
                  <input ref={fileRef} type="file" accept="*/*" className="hidden" onChange={handleFileAttach} />
                  <form onSubmit={handleSend} className="flex items-center gap-2">
                    <button type="button" onClick={() => fileRef.current && fileRef.current.click()} className="min-h-[44px] min-w-[44px] rounded-xl bg-zinc-100 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-200 flex items-center justify-center cursor-pointer"><Icon name="paperclip" className="w-4 h-4" /></button>
                    <input value={input} onChange={(e) => setInput(e.target.value)} placeholder={lang === 'am' ? 'መልእክት ይጻፉ...' : 'Write a message...'} className="flex-1 min-h-[44px] rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 px-3.5 text-sm text-zinc-900 dark:text-zinc-100 focus:outline-none focus:border-rose-500" />
                    <button type="submit" className="min-h-[44px] px-4 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-sm font-semibold flex items-center gap-1.5 cursor-pointer shrink-0"><Icon name="send" className="w-4 h-4" /><span className="hidden sm:inline">{lang === 'am' ? 'ላክ' : 'Send'}</span></button>
                  </form>
                </div>
              )}
            </div>
          </div>
        );
      };

      const NotificationsScreen = ({ lang, notifications, onMarkAllRead, onRespondFriendRequest, onViewPerson }) => {
        const hasUnread = notifications.some((n) => !n.read);
        return (
          <div className="max-w-2xl mx-auto w-full space-y-4">
            <div className="flex items-center justify-between gap-2">
              <div>
                <h2 className="text-xl font-bold text-zinc-900 dark:text-white">{lang === 'am' ? 'ማሳወቂያዎች' : 'Notifications'}</h2>
                <p className="text-xs sm:text-sm text-zinc-500 mt-0.5">{lang === 'am' ? 'ግጥምጥሞሽ፣ የጓደኝነት ጥያቄዎች እና መውደዶች' : 'Matches, friend requests, and profile activity'}</p>
              </div>
              {hasUnread && <button type="button" onClick={onMarkAllRead} className="min-h-[40px] px-3.5 rounded-xl bg-zinc-200/80 dark:bg-zinc-800 text-xs font-semibold cursor-pointer">{lang === 'am' ? 'ሁሉንም አንብቤያለሁ' : 'Mark all read'}</button>}
            </div>
            {notifications.length === 0 ? (
              <div className="rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 p-8 text-center text-sm text-zinc-500">{lang === 'am' ? 'ምንም አዲስ ማሳወቂያ የለም።' : 'You are all caught up.'}</div>
            ) : (
              <div className="space-y-2.5">
                {notifications.map((n) => (
                  <div key={n.id} className={`rounded-2xl border p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${n.read ? 'bg-white dark:bg-zinc-900 border-zinc-200 dark:border-zinc-800' : 'bg-rose-500/5 dark:bg-rose-500/10 border-rose-500/30'}`}>
                    <div onClick={() => n.personId && onViewPerson(n.personId)} className="flex items-center gap-3 min-w-0 cursor-pointer">
                      <Avatar name={n.personName} color={n.avatarColor} size="sm" />
                      <div className="min-w-0">
                        <div className="flex items-center gap-2"><span className="text-sm font-bold truncate">{n.personName}</span><span className="text-xs text-zinc-500 tabular-nums">{n.time}</span></div>
                        <p className="text-xs sm:text-sm text-zinc-600 dark:text-zinc-300 mt-0.5">{lang === 'am' ? n.messageAm : n.messageEn}</p>
                      </div>
                    </div>
                    {n.type === 'friend_request' && (
                      <div className="flex items-center gap-2 shrink-0">
                        {n.handled ? (
                          <span className="text-xs font-semibold text-emerald-600 flex items-center gap-1"><Icon name="usercheck" className="w-3.5 h-3.5" />{n.handled === 'accepted' ? (lang === 'am' ? 'ተቀብለዋል' : 'Accepted') : (lang === 'am' ? 'ውድቅ ተደርጓል' : 'Declined')}</span>
                        ) : (
                          <>
                            <button type="button" onClick={() => onRespondFriendRequest(n.id, n.personId, true)} className="min-h-[38px] px-3.5 rounded-xl bg-rose-600 text-white text-xs font-semibold flex items-center gap-1 cursor-pointer"><Icon name="check" className="w-3.5 h-3.5" /><span>{lang === 'am' ? 'ተቀበል' : 'Accept'}</span></button>
                            <button type="button" onClick={() => onRespondFriendRequest(n.id, n.personId, false)} className="min-h-[38px] px-3 rounded-xl bg-zinc-200 dark:bg-zinc-800 text-xs font-medium cursor-pointer">{lang === 'am' ? 'ተው' : 'Decline'}</button>
                          </>
                        )}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      };

      // --- Settings Screen ---
      const SettingsScreen = ({ lang, theme, user, messagePrivacy, blockedPeople, onChangeMessagePrivacy, onUnblockPerson, onToggleTheme, onToggleLang, onEditProfile, onCreateNewProfile, onUpdatePhoto, onChangePassword, onLogout, onRequestDeleteAccount, onNotify }) => {
        const [currentPwd, setCurrentPwd] = useState('');
        const [newPwd, setNewPwd] = useState('');
        const [confirmPwd, setConfirmPwd] = useState('');
        const [showPwd, setShowPwd] = useState(false);
        const [confirmNewProfile, setConfirmNewProfile] = useState(false);
        const [showInstallGuide, setShowInstallGuide] = useState(false);
        const [activeSlot, setActiveSlot] = useState(0);
        const [deferredPrompt, setDeferredPrompt] = useState(null);
        const [isInstalled, setIsInstalled] = useState(() => window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
        const photoInputRef = useRef(null);

        useEffect(() => {
          const onBeforeInstall = (e) => { e.preventDefault(); setDeferredPrompt(e); };
          const onInstalled = () => { setIsInstalled(true); setDeferredPrompt(null); };
          window.addEventListener('beforeinstallprompt', onBeforeInstall);
          window.addEventListener('appinstalled', onInstalled);
          return () => { window.removeEventListener('beforeinstallprompt', onBeforeInstall); window.removeEventListener('appinstalled', onInstalled); };
        }, []);

        const appUrl = window.location.href;
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

        const handleCopyAppLink = async () => {
          try { await navigator.clipboard.writeText(appUrl); onNotify(lang === 'am' ? 'የመተግበሪያው ሊንክ ተቀድቷል!' : 'App download link copied!'); }
          catch { onNotify(appUrl); }
        };

        const handleNativeInstall = async () => {
          if (!deferredPrompt) return;
          await deferredPrompt.prompt();
          const res = await deferredPrompt.userChoice;
          if (res.outcome === 'accepted') onNotify(lang === 'am' ? 'መተግበሪያው በመጫን ላይ ነው!' : 'Installing Fikir BeNetsa app!');
          setDeferredPrompt(null);
        };

        const handlePhotoFileChange = async (e) => {
          const file = e.target.files?.[0];
          e.target.value = '';
          if (!file) return;
          try { const url = await compressImageToDataUrl(file, 640); onUpdatePhoto(activeSlot, url); }
          catch { onNotify(lang === 'am' ? 'ፎቶ መጫን አልተቻለም' : 'Failed to upload photo'); }
        };

        const handlePasswordSubmit = (e) => {
          e.preventDefault();
          if (user.password && currentPwd !== user.password) { onNotify(lang === 'am' ? 'የቀድሞው የይለፍ ቃል ትክክል አይደለም!' : 'Current password is incorrect!'); return; }
          if (newPwd.trim().length < 4) { onNotify(lang === 'am' ? 'አዲሱ የይለፍ ቃል ቢያንስ 4 ቁምፊ መሆን አለበት!' : 'New password must be at least 4 characters!'); return; }
          if (newPwd !== confirmPwd) { onNotify(lang === 'am' ? 'አዲሱ የይለፍ ቃል እና ማረጋገጫው አይመሳሰሉም!' : 'Passwords do not match!'); return; }
          onChangePassword(newPwd.trim());
          setCurrentPwd(''); setNewPwd(''); setConfirmPwd('');
        };

        return (
          <div className="max-w-2xl mx-auto w-full space-y-5">
            <div>
              <h2 className="text-xl font-bold text-zinc-900 dark:text-white">{lang === 'am' ? 'የግል ቅንብሮች (Personal Settings)' : 'Personal Settings & Profile'}</h2>
              <p className="text-xs sm:text-sm text-zinc-500 mt-0.5">{lang === 'am' ? 'መገለጫዎን ይቀይሩ፣ አዲስ መገለጫ ይጫኑ፣ የይለፍ ቃልዎን እና ግላዊነትዎን ያስተካክሉ።' : 'Update your profile, create or upload a new profile, change password, and manage privacy.'}</p>
            </div>

            <div className="rounded-3xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 p-5 sm:p-6 space-y-5">
              <div className="flex flex-col items-center text-center space-y-2.5">
                <Avatar name={user.name} src={user.photos.find(Boolean)} size="xl" verified={user.selfieVerified} />
                <div>
                  <h3 className="text-xl font-bold tabular-nums flex items-center justify-center gap-1.5"><span>{user.name}, {user.age}</span>{user.selfieVerified && <Icon name="shieldcheck" className="w-5 h-5 text-emerald-500" />}</h3>
                  <p className="text-xs sm:text-sm text-zinc-500 mt-0.5">{user.city} · {user.job} · {user.phone}</p>
                  <p className="text-xs text-rose-600 dark:text-rose-400 font-medium mt-1">{user.religion} · {user.goal} · {user.hobbies}</p>
                </div>
                <p className="text-sm text-zinc-700 dark:text-zinc-300 max-w-md leading-relaxed">“{user.bio}”</p>
              </div>

              <div>
                <span className="block text-xs font-medium text-zinc-500 mb-2">{lang === 'am' ? 'ፎቶ ለመቀየር ከታች ያሉትን ፎቶዎች ይጫኑ' : 'Tap any photo slot below to replace it'}</span>
                <input ref={photoInputRef} type="file" accept="image/*" className="hidden" onChange={handlePhotoFileChange} />
                <div className="grid grid-cols-4 gap-2">
                  {user.photos.map((photo, idx) => (
                    <button key={idx} type="button" onClick={() => { setActiveSlot(idx); photoInputRef.current && photoInputRef.current.click(); }} className="relative aspect-square rounded-xl border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-950 overflow-hidden flex items-center justify-center text-xs text-zinc-400 group cursor-pointer hover:border-rose-500">
                      {photo ? <img src={photo} alt={`Profile ${idx + 1}`} className="w-full h-full object-cover" /> : <span>#{idx + 1}</span>}
                      <span className="absolute inset-0 bg-black/45 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white"><Icon name="camera" className="w-4 h-4" /></span>
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                <button type="button" onClick={onEditProfile} className="min-h-[46px] rounded-xl bg-zinc-100 dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 text-sm font-semibold flex items-center justify-center gap-2 cursor-pointer"><Icon name="edit" className="w-4 h-4" /><span>{lang === 'am' ? 'መገለጫ ቀይር' : 'Edit Profile'}</span></button>
                <button type="button" onClick={() => setConfirmNewProfile(true)} className="min-h-[46px] rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-sm font-semibold flex items-center justify-center gap-2 cursor-pointer"><Icon name="userplus" className="w-4 h-4" /><span>{lang === 'am' ? 'አዲስ መገለጫ ጫን' : 'New Profile'}</span></button>
                <button type="button" onClick={onRequestDeleteAccount} className="min-h-[46px] rounded-xl bg-red-600/15 hover:bg-red-600 hover:text-white text-red-600 dark:text-red-400 text-sm font-semibold flex items-center justify-center gap-2 cursor-pointer"><Icon name="trash" className="w-4 h-4" /><span>{lang === 'am' ? 'መለያ አጥፋ' : 'Delete'}</span></button>
              </div>
            </div>

            <form onSubmit={handlePasswordSubmit} className="rounded-3xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 p-5 space-y-4">
              <div className="flex items-center justify-between">
                <h3 className="text-sm font-bold flex items-center gap-2"><Icon name="key" className="w-4 h-4 text-rose-500" /><span>{user.password ? (lang === 'am' ? 'የይለፍ ቃል ቀይር (Change Password)' : 'Change Account Password') : (lang === 'am' ? 'የይለፍ ቃል አዘጋጅ (Set Password)' : 'Set Account Password')}</span></h3>
                <button type="button" onClick={() => setShowPwd((v) => !v)} className="text-xs font-medium text-zinc-500 flex items-center gap-1 cursor-pointer"><Icon name={showPwd ? 'eyeoff' : 'eye'} className="w-3.5 h-3.5" /><span>{showPwd ? (lang === 'am' ? 'ደብቅ' : 'Hide') : (lang === 'am' ? 'አሳይ' : 'Show')}</span></button>
              </div>
              <div className="space-y-3">
                {user.password && (
                  <div>
                    <label className="block text-xs font-medium text-zinc-600 dark:text-zinc-400 mb-1">{lang === 'am' ? 'የቀድሞው የይለፍ ቃል' : 'Current Password'}</label>
                    <input type={showPwd ? 'text' : 'password'} value={currentPwd} onChange={(e) => setCurrentPwd(e.target.value)} placeholder="••••••" className="w-full min-h-[44px] rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 px-3.5 text-sm focus:outline-none focus:border-rose-500" />
                  </div>
                )}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-medium text-zinc-600 dark:text-zinc-400 mb-1">{lang === 'am' ? 'አዲስ የይለፍ ቃል' : 'New Password'}</label>
                    <input type={showPwd ? 'text' : 'password'} value={newPwd} onChange={(e) => setNewPwd(e.target.value)} placeholder={lang === 'am' ? 'ቢያንስ 4 ቁምፊ' : 'Min 4 characters'} className="w-full min-h-[44px] rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 px-3.5 text-sm focus:outline-none focus:border-rose-500" />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-zinc-600 dark:text-zinc-400 mb-1">{lang === 'am' ? 'አዲሱን የይለፍ ቃል አረጋግጥ' : 'Confirm New Password'}</label>
                    <input type={showPwd ? 'text' : 'password'} value={confirmPwd} onChange={(e) => setConfirmPwd(e.target.value)} placeholder="••••••" className="w-full min-h-[44px] rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 px-3.5 text-sm focus:outline-none focus:border-rose-500" />
                  </div>
                </div>
              </div>
              <button type="submit" className="w-full min-h-[44px] rounded-xl bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 text-sm font-semibold cursor-pointer">
                {user.password ? (lang === 'am' ? 'የይለፍ ቃል ቀይር' : 'Update Password') : (lang === 'am' ? 'የይለፍ ቃል አስቀምጥ' : 'Save Password')}
              </button>
            </form>

            <div className="rounded-3xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 p-5 space-y-4">
              <h3 className="text-sm font-bold flex items-center gap-2"><Icon name="lock" className="w-4 h-4 text-rose-500" /><span>{lang === 'am' ? 'ግላዊነት እና ምርጫዎች' : 'Privacy & Preferences'}</span></h3>
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 py-2 border-b border-zinc-100 dark:border-zinc-800">
                <div><p className="text-sm font-medium">{lang === 'am' ? 'መልእክት ማን መላክ ይችላል?' : 'Who can message me?'}</p><p className="text-xs text-zinc-500">{lang === 'am' ? 'ያልተፈቀዱ መልእክቶችን ይቆጣጠሩ' : 'Control incoming chat access'}</p></div>
                <select value={messagePrivacy} onChange={(e) => onChangeMessagePrivacy(e.target.value)} className="min-h-[42px] rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 px-3 text-sm">

          </div>

      };
      // --- Root App Component ---
      const STORAGE_KEYS = {
        user: 'fb_user_v2', lang: 'fb_lang_v2', theme: 'fb_theme_v2', msgPrivacy: 'fb_mp_v2',
        people: 'fb_people_v2', posts: 'fb_posts_v2', chats: 'fb_chats_v2', notifs: 'fb_notifs_v2',
        blocked: 'fb_blocked_v2', privateConfig: 'fb_prv_cfg_v2', privatePosts: 'fb_prv_posts_v2', privateChats: 'fb_prv_chats_v2'
      };

      function readStorage(key, fallback) {
        try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch { return fallback; }
      }

      function App() {
        const [lang, setLang] = useState(() => readStorage(STORAGE_KEYS.lang, 'am'));
        const [theme, setTheme] = useState(() => readStorage(STORAGE_KEYS.theme, 'dark'));
        const [user, setUser] = useState(() => readStorage(STORAGE_KEYS.user, null));
        const [isLoggedIn, setIsLoggedIn] = useState(() => Boolean(readStorage(STORAGE_KEYS.user, null)));
        const [screen, setScreen] = useState(() => (readStorage(STORAGE_KEYS.user, null) ? 'main' : 'login'));
        const [previousScreen, setPreviousScreen] = useState('main');
        const [isEditingProfile, setIsEditingProfile] = useState(false);
        const [isCreatingNewProfile, setIsCreatingNewProfile] = useState(false);

        const [subTab, setSubTab] = useState('people');
        const [people, setPeople] = useState(() => readStorage(STORAGE_KEYS.people, INITIAL_PEOPLE));
        const [posts, setPosts] = useState(() => readStorage(STORAGE_KEYS.posts, INITIAL_POSTS));
        const [conversations, setConversations] = useState(() => readStorage(STORAGE_KEYS.chats, INITIAL_CONVERSATIONS));
        const [notifications, setNotifications] = useState(() => readStorage(STORAGE_KEYS.notifs, INITIAL_NOTIFICATIONS));
        const [blockedIds, setBlockedIds] = useState(() => readStorage(STORAGE_KEYS.blocked, []));
        const [messagePrivacy, setMessagePrivacy] = useState(() => readStorage(STORAGE_KEYS.msgPrivacy, 'all'));

        const [selectedPersonId, setSelectedPersonId] = useState(1);
        const [activeChatPersonId, setActiveChatPersonId] = useState(1);
        const [unreadChatCount, setUnreadChatCount] = useState(1);
        const [matchModalPerson, setMatchModalPerson] = useState(null);
        const [reportTargetName, setReportTargetName] = useState(null);
        const [confirmDeleteOpen, setConfirmDeleteOpen] = useState(false);

        const [privateConfig, setPrivateConfig] = useState(() => readStorage(STORAGE_KEYS.privateConfig, null));
        const [privateUnlocked, setPrivateUnlocked] = useState(false);
        const [privateScreen, setPrivateScreen] = useState('p-main');
        const [privateUsers] = useState(INITIAL_PRIVATE_USERS);
        const [privatePosts, setPrivatePosts] = useState(() => readStorage(STORAGE_KEYS.privatePosts, INITIAL_PRIVATE_POSTS));
        const [privateChats, setPrivateChats] = useState(() => readStorage(STORAGE_KEYS.privateChats, INITIAL_PRIVATE_CHATS));
        const [privateNotifs, setPrivateNotifs] = useState(INITIAL_PRIVATE_NOTIFICATIONS);
        const [activePrivateUserId, setActivePrivateUserId] = useState('mystery_18');

        const [toast, setToast] = useState(null);
        const [isOnline, setIsOnline] = useState(() => navigator.onLine);

        const showToast = (msg) => setToast(msg);

        useEffect(() => {
          const up = () => setIsOnline(true);
          const down = () => setIsOnline(false);
          window.addEventListener('online', up);
          window.addEventListener('offline', down);
          return () => { window.removeEventListener('online', up); window.removeEventListener('offline', down); };
        }, []);

        useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 2600); return () => clearTimeout(t); }, [toast]);
        useEffect(() => { document.documentElement.classList.toggle('dark', theme === 'dark'); try { localStorage.setItem(STORAGE_KEYS.theme, JSON.stringify(theme)); } catch {} }, [theme]);
        useEffect(() => { document.documentElement.lang = lang; try { localStorage.setItem(STORAGE_KEYS.lang, JSON.stringify(lang)); } catch {} }, [lang]);
        useEffect(() => { try { if (user) localStorage.setItem(STORAGE_KEYS.user, JSON.stringify(user)); else localStorage.removeItem(STORAGE_KEYS.user); } catch {} }, [user]);
        useEffect(() => { try { localStorage.setItem(STORAGE_KEYS.people, JSON.stringify(people)); } catch {} }, [people]);
        useEffect(() => { try { localStorage.setItem(STORAGE_KEYS.posts, JSON.stringify(posts)); } catch {} }, [posts]);
        useEffect(() => { try { localStorage.setItem(STORAGE_KEYS.chats, JSON.stringify(conversations)); } catch {} }, [conversations]);

                  <button key={tab.id} type="button" onClick={() => navigateTo(tab.id)} className={`relative flex flex-col items-center justify-center gap-0.5 text-[10px] font-medium cursor-pointer ${active ? (isPrivate ? 'text-purple-500 font-semibold' : 'text-rose-600 dark:text-rose-500 font-semibold') : 'text-zinc-500 dark:text-zinc-400'}`}>
                    <Icon name={tab.icon} className="w-5 h-5" />
                    <span className="truncate max-w-full px-1">{lang === 'am' ? tab.labelAm : tab.labelEn}</span>
                    {tab.badge ? <span className="absolute top-1.5 right-2.5 min-w-[16px] h-4 px-1 rounded-full bg-rose-600 text-white text-[9px] font-bold flex items-center justify-center tabular-nums">{tab.badge}</span> : null}
                  </button>
                );
              })}
            </nav>

            <MatchModal person={matchModalPerson} lang={lang} onMessage={(id) => { setMatchModalPerson(null); handleOpenChat(id); }} onClose={() => setMatchModalPerson(null)} />
            <ReportModal targetName={reportTargetName} lang={lang} onSubmit={() => { setReportTargetName(null); showToast(lang === 'am' ? 'ሪፖርትዎ ለአስተዳዳሪዎች ተልኳል!' : 'Report submitted for safety review!'); }} onClose={() => setReportTargetName(null)} />
            <ConfirmModal open={confirmDeleteOpen} title={lang === 'am' ? 'መለያዎን እስከመጨረሻው ማጥፋት?' : 'Delete Account Permanently?'} description={lang === 'am' ? 'ሁሉም መረጃዎ፣ ፎቶዎችዎ እና መልእክቶችዎ እስከመጨረሻው ይጠፋሉ።' : 'All your profile data, photos, and messages will be permanently removed.'} confirmLabel={lang === 'am' ? 'አዎ፣ አጥፋ' : 'Delete Permanently'} cancelLabel={lang === 'am' ? 'ተወው' : 'Cancel'} onConfirm={handleDeleteAccount} onCancel={() => setConfirmDeleteOpen(false)} />
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
